[package]
name = "collection-view"
version = "1.0.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "collection_view_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] } # Tauri 仅保留核心桌面运行能力。
serde = { version = "1", features = ["derive"] } # 序列化 Realm 数据、命令参数和应用设置。
serde_json = "1" # 持久化 Rust 管理的应用设置。
tauri-plugin-dialog = "2.7.3" # 仅向 WebView 开放系统文件和消息对话框。
base64 = "0.22" # 将 Rust 缓存的封面转换为前端可直接展示的数据地址。
chrono = { version = "0.4", default-features = false, features = ["clock"] } # 生成 Realm 加载时间并格式化数据库时间戳。
realm-db-reader = { git = "https://github.com/Ohdmire/realm-db-reader", rev = "21b7d2daee9b51059be604a3fe03a689e16ba9cf" } # 直接读取 osu!lazer 的现代 Realm 24 数据库。
reqwest = { version = "0.13.2", default-features = false, features = ["rustls"] } # 复用锁文件中的 Rustls HTTP 客户端下载封面。
zip = { version = "0.6.6", default-features = false, features = ["deflate"] } # 只启用 Excel 和导出 ZIP 所需的 Deflate 压缩。
