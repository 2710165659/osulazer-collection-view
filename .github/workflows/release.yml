name: 构建并发布 Windows 便携版

on:
  pull_request:
    branches:
      - main
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: 要构建并发布的标签；留空时使用当前工作流引用
        required: false
        default: ""

permissions:
  contents: write # 标签构建需要将便携 EXE 上传到 GitHub Release。

jobs:
  build:
    name: 编译 Windows 单二进制便携版
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }} # 手动运行时优先使用输入标签，其余事件使用触发引用。
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }} # 标签构建必须固定源码版本。

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 配置 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 安装前端依赖
        run: npm ci

      - name: 构建前端资源
        run: npm run build

      - name: 编译 Rust 单二进制
        working-directory: src-tauri
        run: cargo build --release --features tauri/custom-protocol

      - name: 准备便携 EXE
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $versionLine = Select-String -LiteralPath "src-tauri/Cargo.toml" -Pattern '^version\s*=\s*"([^"]+)"$' | Select-Object -First 1
          if (-not $versionLine) {
            throw "src-tauri/Cargo.toml 中未找到应用版本。"
          }
          $version = $versionLine.Matches.Groups[1].Value
          if ($env:RELEASE_TAG -notmatch '^v[^/]+$') {
            throw "发布事件必须使用 v 开头的标签，当前引用为 $env:RELEASE_TAG。"
          }
          $tagVersion = $env:RELEASE_TAG.Substring(1)
          if ($tagVersion -ne $version) {
            throw "发布标签 $env:RELEASE_TAG 与 Cargo.toml 版本 $version 不一致。"
          }
          $exe = Join-Path $env:GITHUB_WORKSPACE "src-tauri/target/release/collection-view.exe"
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw "未找到构建产物 $exe。"
          }
          "ASSET_PATH=$exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Get-FileHash -LiteralPath $exe -Algorithm SHA256 | Format-List

      - name: 创建 GitHub Release
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notesPath = Join-Path $env:RUNNER_TEMP "release-notes.md"
          $changelogPath = Join-Path $env:GITHUB_WORKSPACE "CHANGELOG.md"
          $changelog = Get-Content -LiteralPath $changelogPath -Raw
          $versionPattern = [regex]::Escape($env:RELEASE_VERSION)
          $sectionPattern = "(?ms)^##\s+v?$versionPattern(?:\s|$).*?\r?\n(?<body>.*?)(?=^##\s+|\z)"
          $section = [regex]::Match($changelog, $sectionPattern)
          if (-not $section.Success) {
            throw "CHANGELOG.md 中未找到版本 $env:RELEASE_VERSION 对应的章节。"
          }
          $releaseNotes = $section.Groups['body'].Value.Trim()
          if ([string]::IsNullOrWhiteSpace($releaseNotes)) {
            throw "CHANGELOG.md 中版本 $env:RELEASE_VERSION 的说明为空。"
          }
          Set-Content -LiteralPath $notesPath -Value $releaseNotes -Encoding utf8
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          $releaseExists = $LASTEXITCODE -eq 0
          if ($releaseExists) {
            gh release upload $env:RELEASE_TAG $env:ASSET_PATH --repo $env:GITHUB_REPOSITORY --clobber
            gh release edit $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --title "v$env:RELEASE_VERSION Windows 便携版" --notes-file $notesPath
          } else {
            gh release create $env:RELEASE_TAG $env:ASSET_PATH --repo $env:GITHUB_REPOSITORY --title "v$env:RELEASE_VERSION Windows 便携版" --notes-file $notesPath --verify-tag
          }
